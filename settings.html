<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>设置</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <aside id="nav">
    <div class="nav-item active" data-panel="font">字体</div>
    <div class="nav-item" data-panel="boot">开机自启</div>
  </aside>

  <main id="content">
    <!-- 字体 -->
    <section id="panel-font" class="panel active">
      <div class="row">
        <div class="row-head">
          <span class="row-label">字体大小</span>
          <span id="font-size-val" class="val"></span>
        </div>
        <input id="font-size" type="range" min="11" max="20" step="1">
      </div>
      <div class="row">
        <div class="row-head">
          <span class="row-label">字体粗细</span>
          <span id="font-weight-val" class="val"></span>
        </div>
        <input id="font-weight" type="range" min="300" max="700" step="50">
      </div>
      <div id="preview">预览：完成项目报告 ABC abc 123</div>
    </section>

    <!-- 开机自启 -->
    <section id="panel-boot" class="panel">
      <div class="row row-line">
        <div class="row-text">
          <div class="row-label">开机自启动</div>
          <div class="desc">登录 Windows 后自动启动便签窗口</div>
          <div id="boot-hint" class="hint"></div>
        </div>
        <label class="switch" title="开机自启动">
          <input id="auto-start" type="checkbox">
          <span class="switch-ui"></span>
        </label>
      </div>
    </section>
  </main>

  <script src="settings.js"></script>
</body>
</html>
